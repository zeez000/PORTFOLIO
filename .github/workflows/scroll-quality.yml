name: Live portfolio scroll checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: live-scroll-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-checks:
    if: github.repository == 'zeez000/PORTFOLIO'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tests
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Validate scroll integration
        run: |
          node --check script.js
          node --check smooth-scroll.js
          node --check aurora.js
          node --check text-flow.js
          python tests/check_smooth_scroll.py
      - name: Verify published scrolling after deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://abdulazeez.is-a.dev/
        run: |
          python - <<'PY'
          import os, pathlib, time, urllib.request
          expected = {
              'smooth-scroll.js': pathlib.Path('smooth-scroll.js').read_bytes(),
              'aurora.js': pathlib.Path('aurora.js').read_bytes(),
              'text-flow.js': pathlib.Path('text-flow.js').read_bytes(),
          }
          for attempt in range(30):
              try:
                  matched = True
                  for name, content in expected.items():
                      url = os.environ['BASE_URL'] + name + '?verify=' + os.environ['GITHUB_SHA']
                      request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=10) as response:
                          if response.read() != content:
                              matched = False
                              break
                  if matched:
                      print('Published scroll, Aurora, and text-flow modules match tested commit')
                      break
              except Exception as error:
                  print('Deployment check:', str(error))
              time.sleep(3)
          else:
              raise SystemExit('Published scroll module could not be verified')
          PY
          python tests/check_smooth_scroll.py
      - name: Save scroll screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-portfolio-scroll-review
          path: scroll-qa/
          retention-days: 7
